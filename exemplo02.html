 <!DOCTYPE html>
 <html lang="pt-BR">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 02</title>
    <link rel = "stylesheet" href = "estilo.css">
    <style>
      ul{
        list-style: none;
        padding: 0;
        margin: 0;
      }
      ul > li {
        border: 1px solid green;
        background-color: lightgreen;
      }

      .desconstructed-pancake {
        display: flex; 
        flex-flow: column wrap;
        justify-content: center;
      }
      .desconstructed-pancake > * {
        flex: 1 0 120px;
      }
    </style>
 </head>
 <body>
    <main>
      <article>
         <ul class = "desconstructed-pancake">
          <li>Lorem ipsum dolor sit.</li>
          <li>Dignissimos natus velit possimus!</li>
          <li>Molestiae libero quas dicta!</li>
          <li>Pariatur a sequi at.</li>
         </ul>
      </article>
    </main>
 </body>
 </html>
